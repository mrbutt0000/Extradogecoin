<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Extra Doge Coin ($EDOGE) | Meme, AI &amp; Gaming Utility</title>
<meta name="author" content="PBM Technologies">
<meta name="description" content="Extra Doge Coin ($EDOGE) is a community meme token with a fixed 510M supply, 0% buy/sell tax and an AI and gaming utility roadmap. Launching soon.">
<meta property="og:title" content="Extra Doge Coin ($EDOGE)">
<meta property="og:description" content="Fixed 510M supply. 0% tax. AI and gaming utility roadmap. Launching soon.">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐕</text></svg>">
<style>
  :root{
    --bg:#0b0d12; --bg2:#12151d; --card:#161a24; --line:#262c3a;
    --text:#eef0f5; --muted:#9aa3b5; --gold:#f7b731; --gold2:#ffd76a; --green:#2ecc8f; --red:#ff6b6b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;overflow-x:hidden}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1080px;margin:0 auto;padding:0 20px}
  section{padding:72px 0}
  h1,h2,h3{line-height:1.2}
  h2{font-size:clamp(26px,4vw,36px);text-align:center;margin-bottom:10px}
  .sub{text-align:center;color:var(--muted);max-width:620px;margin:0 auto 40px}
  .gold{color:var(--gold)}

  /* Nav */
    <div class="ca-box reveal" id="caBox">
      <div id="caStatus"><b>Not launched yet</b></div>
      <div class="ca-val" id="caVal">Contract address will be announced at launch.</div>
      <button class="btn btn-gold btn-sm" id="caCopy" style="display:none">Copy Address</button>
    </div>
  </div>
</section>

<section id="whitepaper">
  <div class="wrap">
    <h2 class="reveal"><span class="gold">$EDOGE</span> Whitepaper</h2>
    <p class="sub reveal">Version 1.0 • October 2026</p>
    <article class="paper reveal">
      <h3>Extra Doge Coin ($EDOGE) Whitepaper</h3>
      <div class="ver">Version 1.0 | October 2026</div>

      <h4>1. Executive Summary</h4>
      <p>Extra Doge Coin ($EDOGE) is a community-driven meme token. The blockchain network will be announced before launch. It aims to blend internet meme culture with AI and gaming utilities, built on transparent tokenomics and a zero-tax design.</p>

      <h4>2. Tokenomics</h4>
      <p>Planned total supply: 510,000,000 $EDOGE (fixed).</p>
      <ul>
        <li><b>50% Liquidity Pool:</b> 255,000,000 $EDOGE added to liquidity at launch, with LP lock proof to be published.</li>
        <li><b>10% Community Airdrop:</b> 51,000,000 $EDOGE for early supporters and active participants.</li>
        <li><b>20% AI &amp; Gaming Utility:</b> 102,000,000 $EDOGE for ecosystem and utility development.</li>
        <li><b>20% Team, Marketing &amp; Operations:</b> 102,000,000 $EDOGE. Vesting / lock details will be published before launch.</li>
      </ul>

      <h4>3. Security &amp; Transparency</h4>
      <p>$EDOGE is planned with a 0% buy and 0% sell tax. At launch, mint and freeze authorities are planned to be revoked, and proof (transaction links) will be published. Liquidity lock details and wallet addresses will be shared publicly after launch. No technology can remove all risk, so please do your own research.</p>

  /* ================================================= */

  (function(){
    if(CONTRACT_ADDRESS){
      var box=document.getElementById("caBox"), val=document.getElementById("caVal"),
          st=document.getElementById("caStatus"), btn=document.getElementById("caCopy");
      box.classList.add("live");
      st.innerHTML="<b style='color:var(--green)'>✅ Official Contract Address</b>";
      val.textContent=CONTRACT_ADDRESS;
      btn.style.display="inline-block";
      btn.onclick=function(){
        if(navigator.clipboard){navigator.clipboard.writeText(CONTRACT_ADDRESS)}
        btn.textContent="Copied!"; setTimeout(function(){btn.textContent="Copy Address"},1800);
      };
      if(EXPLORER_LINK){
        var a=document.createElement("a");
        a.href=EXPLORER_LINK;a.target="_blank";a.rel="noopener";
        a.className="btn btn-line btn-sm";a.style.marginLeft="10px";a.textContent="View on Explorer";
        btn.parentNode.appendChild(a);
      }
    }

    var io=new IntersectionObserver(function(es){
      es.forEach(function(e){ if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)} });
    },{threshold:.12});
    document.querySelectorAll(".reveal").forEach(function(el){io.observe(el)});
  })();
</script>
</body>
</html>
